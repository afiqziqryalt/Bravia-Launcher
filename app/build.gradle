plugins { id 'com.android.application' }

android {
    namespace 'com.oso.xmbhome'
    compileSdk 28
    defaultConfig {
        applicationId 'com.oso.xmbhome'
        minSdk 28        // the TV runs Android 10
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
